name: tax-business-system

services:
  mysql:
    image: mysql:8.0
    container_name: tax-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tax_business}
      MYSQL_USER: ${MYSQL_USER:-tax_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-TaxDemo_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-TaxRoot_2026}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - tax_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - tax-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tax-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tax_business}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
      DB_USERNAME: ${MYSQL_USER:-tax_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-TaxDemo_2026}
      CORS_ALLOWED_ORIGINS: "http://localhost:${APP_PORT:-18080},http://127.0.0.1:${APP_PORT:-18080}"
      EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-5000}
    ports:
      - "${BACKEND_PORT:-18081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - tax-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tax-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tax-network

volumes:
  tax_mysql_data:
    name: tax-business-mysql-data

networks:
  tax-network:
    name: tax-business-network
